services:
  - type: web
    name: taverna
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taverna-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: VITE_STUN_URLS
        value: stun:stun.l.google.com:19302

databases:
  - name: taverna-db
    plan: free
    databaseName: taverna
    user: taverna
